<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel - Login</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
<div class="login-card">
  <div class="logo">🚀</div>
  <h1>ADMIN PANEL</h1>
  <p class="muted">Login untuk mengelola redirect link</p>
  <form id="loginForm">
    <label>Password</label>
    <div class="password-wrap">
      <input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password">
      <button type="button" id="togglePassword" class="eye">👁</button>
    </div>
    <button class="primary" type="submit">LOGIN</button>
    <div id="loginMsg" class="message"></div>
  </form>
</div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
